[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brokerrecon"
version = "0.1.0"
description = "Prototype: AI-assisted, deterministic reconciliation of broker-confirmed open derivative trades to an internal trade list, with a full audit trail"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
brokerrecon = "brokerrecon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
